# MoveIt talks to the local trajectory_topic_adapter action server. The adapter
# forwards JointTrajectory commands to the ROS 1 effort controller via bridge.

moveit_simple_controller_manager:
  controller_names:
    - effort_joint_trajectory_controller

  effort_joint_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
